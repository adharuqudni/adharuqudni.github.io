<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Samsung R&amp;D — office tower">
  <rect width="96" height="96" fill="#C5EFD3"/>
  <g stroke="#23233B" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- antenna -->
    <line x1="48" y1="28" x2="48" y2="14"/>
    <circle cx="48" cy="12" r="3.5" fill="#FF5D5D"/>
    <!-- tower -->
    <rect x="28" y="28" width="40" height="52" rx="6" fill="#53D387"/>
    <!-- windows -->
    <g fill="#FFF4DC" stroke-width="2.5">
      <rect x="35" y="36" width="10" height="9" rx="2"/>
      <rect x="51" y="36" width="10" height="9" rx="2"/>
      <rect x="35" y="50" width="10" height="9" rx="2"/>
      <rect x="51" y="50" width="10" height="9" rx="2"/>
    </g>
    <!-- door -->
    <rect x="42" y="66" width="12" height="14" rx="3" fill="#23233B" stroke-width="2.5"/>
  </g>
  <!-- sparkles -->
  <path d="M15 22l2.2 4.6 4.6 2.2-4.6 2.2L15 35.6l-2.2-4.6-4.6-2.2 4.6-2.2z" fill="#FFC93C" stroke="#23233B" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="82" cy="60" r="3" fill="#FFFFFF" stroke="#23233B" stroke-width="2"/>
</svg>
