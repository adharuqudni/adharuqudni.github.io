<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="PT Elnusa — oil derrick">
  <rect width="96" height="96" fill="#FFE08A"/>
  <!-- ground -->
  <line x1="16" y1="80" x2="80" y2="80" stroke="#23233B" stroke-width="3.5" stroke-linecap="round"/>
  <!-- derrick lattice -->
  <g stroke="#23233B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M34 80 L44 18 H52 L62 80" fill="#FF9F45"/>
    <line x1="37.5" y1="60" x2="58.5" y2="60"/>
    <line x1="40" y1="42" x2="56" y2="42"/>
    <line x1="38" y1="60" x2="56" y2="42"/>
    <line x1="58" y1="60" x2="40" y2="42"/>
    <!-- pulley top -->
    <circle cx="48" cy="14" r="4.5" fill="#FFC93C"/>
  </g>
  <!-- oil drop -->
  <path d="M74 52 C68 61 68 66 74 70 C80 66 80 61 74 52 Z" fill="#23233B" stroke="#23233B" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="71.8" cy="63" r="1.8" fill="#FFFFFF"/>
  <!-- gold star (CIP Forum first place) -->
  <path d="M20 24l2.6 5.4 5.4 2.6-5.4 2.6L20 40l-2.6-5.4L12 32l5.4-2.6z" fill="#FFC93C" stroke="#23233B" stroke-width="2.2" stroke-linejoin="round"/>
</svg>
